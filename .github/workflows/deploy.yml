name: Build y Deploy CajaMenor

on:
  push:
    branches: [main]

# Nota: GHCR exige nombres en minúsculas. Si tu usuario/organización de GitHub tiene
# mayúsculas, reemplaza aquí ${{ github.repository_owner }} por tu nombre en minúsculas.
env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/${{ github.repository_owner }}/cajamenor-api
  IMAGE_WEB: ghcr.io/${{ github.repository_owner }}/cajamenor-web

jobs:
  build-test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - run: dotnet restore backend/CajaMenor.sln
      - run: dotnet build backend/CajaMenor.sln -c Release --no-restore

  build-test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: diseñoStitch/stitch-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  build-push-images:
    needs: [build-test-backend, build-test-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y push imagen API
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE_API }}:latest
            ${{ env.IMAGE_API }}:${{ github.sha }}

      - name: Build y push imagen Web
        uses: docker/build-push-action@v6
        with:
          context: ./diseñoStitch/stitch-app
          push: true
          tags: |
            ${{ env.IMAGE_WEB }}:latest
            ${{ env.IMAGE_WEB }}:${{ github.sha }}

  deploy:
    needs: build-push-images
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Desplegar en el VPS por SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/cajamenor
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
