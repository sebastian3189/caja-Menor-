services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express # edición gratuita (suficiente para un piloto pequeño: hasta 10 GB de datos)
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    image: ${IMAGE_API:-cajamenor-api:local}
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: ${DB_CONNECTION}
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      MasterAdmin__User: ${MASTER_ADMIN_USER}
      MasterAdmin__Password: ${MASTER_ADMIN_PASSWORD}
      Seeder__DirectorPassword: ${SEEDER_DIRECTOR_PASSWORD}
      Seeder__AdminPassword: ${SEEDER_ADMIN_PASSWORD}
      Email__SmtpHost: ${EMAIL_SMTP_HOST}
      Email__SmtpPort: ${EMAIL_SMTP_PORT}
      Email__Usuario: ${EMAIL_USUARIO}
      Email__Password: ${EMAIL_PASSWORD}
      Email__Remitente: ${EMAIL_REMITENTE}
      App__FrontendUrl: ${APP_FRONTEND_URL}
      App__ApiUrl: ${APP_API_URL}
      Tesoreria__Email: ${TESORERIA_EMAIL}
      Cors__AllowedOrigins__0: ${APP_FRONTEND_URL}
      Azure__FormRecognizer__Endpoint: ${AZURE_FORM_ENDPOINT}
      Azure__FormRecognizer__Key: ${AZURE_FORM_KEY}
    volumes:
      - uploads:/app/uploads
      - api_logs:/app/logs

  web:
    image: ${IMAGE_WEB:-cajamenor-web:local}
    build:
      context: ./diseñoStitch/stitch-app
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: >
      sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;"

volumes:
  sqldata:
  uploads:
  api_logs:
  certbot_www:
  certbot_certs:
