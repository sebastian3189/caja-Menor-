# Reemplaza DOMINIO_AQUI por tu dominio real antes del primer despliegue:
#   sed -i "s/DOMINIO_AQUI/tu-dominio.com/g" nginx/nginx.conf
#
# IMPORTANTE — arranque en dos fases (el certificado aún no existe la primera vez):
#   1) Deja comentado el bloque "server { listen 443 ... }" de abajo, sube los contenedores,
#      obtén el certificado (ver paso a paso), y RECIÉN AHÍ descomenta el bloque 443 y recarga nginx.

server {
    listen 80;
    server_name DOMINIO_AQUI;

    # Reto ACME de Let's Encrypt (certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Mientras no haya certificado, sirve la app en HTTP (fase 1).
    # Cuando actives el bloque 443 (fase 2), cambia este "location /" por: return 301 https://$host$request_uri;
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://api:8080/health;
    }

    # Los recibos/firmas NUNCA se sirven como estáticos (S-04): solo vía endpoint autenticado de la API.
    location /uploads/ {
        deny all;
        return 404;
    }
}

